spring.application.name=backend

server.port=8080

# Supabase PostgreSQL Connection (Using Session Pooler - IPv4)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.ignore-migration-patterns=versioned:missing,repeatable:missing
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.initialization-fail-timeout=-1

# Image Upload & Application URLs Configuration
app.base-url=${APP_BASE_URL:http://localhost:5173}
app.backend-url=${APP_BACKEND_URL:http://localhost:8080}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:8080,http://localhost:8001,http://localhost:8082,http://localhost:3000,https://travelhublanka.netlify.app,https://travelhub.netlify.app}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Supabase Storage Integration
supabase.url=${SUPABASE_URL:https://gzkohtgqtpbscczxuaaj.supabase.co}
supabase.key=${SUPABASE_KEY}
supabase.bucket=room-images
supabase.hotel-bucket=hotel-images
supabase.review-bucket=review-images
supabase.user-bucket=user-identifications
supabase.agent-bucket=agent-images
supabase.package-bucket=package-images
supabase.report-bucket=report

# Gmail SMTP Configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${GMAIL_USERNAME:davidthanu1006@gmail.com}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.debug=false

# JWT Configuration
jwt.secret=${JWT_SECRET:your_very_long_and_secure_jwt_secret_key_here}
jwt.expiration=86400000

# PayHere (sandbox) - required for /api/payments/checkout/{bookingId}
payhere.merchant.id=${PAYHERE_MERCHANT_ID:1235619}
payhere.merchant.secret=${PAYHERE_SECRET}
payhere.currency=${PAYHERE_CURRENCY:USD}
payhere.checkout.url=${PAYHERE_CHECKOUT_URL:https://sandbox.payhere.lk/pay/checkout}

server.error.include-message=always
server.error.include-stacktrace=always
# Chatbot Service
chatbot.service.url=${CHATBOT_SERVICE_URL:http://localhost:8001}
