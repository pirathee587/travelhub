version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travelhub-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_URL=${SUPABASE_URL:-https://gzkohtgqtpbscczxuaaj.supabase.co}
      - JWT_SECRET=${JWT_SECRET}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - GMAIL_USERNAME=${GMAIL_USERNAME:-davidthanu1006@gmail.com}
      - PAYHERE_SECRET=${PAYHERE_SECRET}
      - PAYHERE_MERCHANT_ID=${PAYHERE_MERCHANT_ID:-1235619}
      - PAYHERE_CURRENCY=${PAYHERE_CURRENCY:-USD}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://travelhub.netlify.app,http://localhost:5173,http://localhost:3000}
      - APP_BASE_URL=${APP_BASE_URL:-https://travelhub.netlify.app}
      - CHATBOT_SERVICE_URL=http://chatbot:8001
    depends_on:
      - chatbot
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - travelhub-network

  chatbot:
    build:
      context: ./chatbot-service
      dockerfile: Dockerfile
    container_name: travelhub-chatbot
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SPRING_BOOT_URL=http://backend:8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - travelhub-network

networks:
  travelhub-network:
    driver: bridge
