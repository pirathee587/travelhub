# Root-level netlify.toml — picked up by nwtgck/actions-netlify GitHub Action.
# The copy inside frontend/ is used when deploying via the Netlify UI drag-drop.

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# Proxy /api/* to EC2 backend server-side.
# Netlify's edge servers make the outbound HTTP call, so the browser
# never sees an HTTP URL — eliminates mixed-content (HTTPS → HTTP) errors.
[[redirects]]
  from = "/api/*"
  to = "http://18.140.197.169:8080/api/:splat"
  status = 200
  force = true

# SPA fallback — must come AFTER the API proxy rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
