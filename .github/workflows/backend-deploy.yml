name: Backend & Chatbot CI/CD (AWS EC2)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - 'chatbot-service/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

jobs:
  test-backend:
    name: 🧪 Test & Validate Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🛠️ Compile & Run Unit Tests
        env:
          DB_URL: "jdbc:postgresql://localhost:5432/travelhub_test"
          DB_USERNAME: "postgres"
          DB_PASSWORD: "testpassword"
          SUPABASE_KEY: "test-supabase-key"
          JWT_SECRET: "test-jwt-secret-key-that-is-at-least-256-bits-long-for-testing"
          GMAIL_APP_PASSWORD: "test-password"
          PAYHERE_SECRET: "test-payhere-secret"
        run: mvn test-compile

  test-chatbot:
    name: 🐍 Validate Chatbot Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: chatbot-service

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Syntax Validation
        run: |
          python -m py_compile main.py data_sync.py

  deploy:
    name: 🚀 Deploy to AWS EC2
    needs: [test-backend, test-chatbot]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: 🧼 Normalize & Validate EC2 Host
        id: prepare_ssh_host
        env:
          RAW_EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail

          host="${RAW_EC2_HOST:-}"
          host="${host#http://}"
          host="${host#https://}"
          host="${host%%/*}"
          host="${host%%\?*}"
          host="${host%%#*}"
          host="$(printf '%s' "$host" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

          if [ -z "$host" ]; then
            echo "::error::EC2_HOST is empty or invalid after normalization. Set it to a raw hostname or IP."
            exit 1
          fi

          if printf '%s' "$host" | grep -q '[[:space:]]'; then
            echo "::error::EC2_HOST contains whitespace. Set it to a raw hostname or IP."
            exit 1
          fi

          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: 🔐 Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.prepare_ssh_host.outputs.host }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            echo "========================================================"
            echo "🚀 Starting TravelHub Deployment on AWS EC2..."
            echo "========================================================"

            # ── Guard: Verify Docker is installed ──────────────────────
            if ! command -v docker &> /dev/null; then
              echo "❌ Docker is not installed on the EC2 instance"
              exit 1
            fi

            # ── Guard: Wait for Docker daemon to be ready (max 30s) ────
            for i in {1..30}; do
              if docker ps > /dev/null 2>&1; then
                echo "✅ Docker daemon is ready"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "❌ Docker daemon failed to start after 30s"
                exit 1
              fi
              echo "⏳ Waiting for Docker daemon... ($i/30)"
              sleep 1
            done

            # ── Locate project root or clone fresh ─────────────────────
            if [ -d "$HOME/travelhub/.git" ]; then
              cd "$HOME/travelhub"
            elif [ -d "/var/www/travelhub/.git" ]; then
              cd "/var/www/travelhub"
            else
              echo "📥 Repo not found, cloning fresh into ~/travelhub..."
              git clone https://github.com/pirathee587/travelhub.git "$HOME/travelhub"
              cd "$HOME/travelhub"
            fi

            echo "📥 Pulling latest updates from git repository..."
            git fetch --all
            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git reset --hard "origin/$BRANCH"

            # ── Detect Compose command (V2 plugin vs V1 standalone) ─────
            if docker compose version &>/dev/null; then
              COMPOSE="docker compose"
            elif docker-compose version &>/dev/null; then
              COMPOSE="docker-compose"
            else
              echo "❌ Neither 'docker compose' nor 'docker-compose' found"
              exit 1
            fi
            echo "✅ Using compose command: $COMPOSE"

            echo "🐳 Stopping existing containers..."
            $COMPOSE down --remove-orphans

            echo "🔨 Building Docker images (separate step to surface build errors)..."
            $COMPOSE build

            echo "🚀 Starting containers..."
            $COMPOSE up -d --remove-orphans

            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f

            echo "⏳ Checking container status and health..."
            sleep 15
            $COMPOSE ps

            echo "========================================================"
            echo "✅ TravelHub backend & chatbot successfully deployed!"
            echo "========================================================"
