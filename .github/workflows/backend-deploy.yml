name: Backend & Chatbot CI/CD (AWS EC2)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - 'chatbot-service/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

jobs:
  test-backend:
    name: 🧪 Test & Validate Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🛠️ Compile & Run Unit Tests
        env:
          DB_URL: "jdbc:postgresql://localhost:5432/travelhub_test"
          DB_USERNAME: "postgres"
          DB_PASSWORD: "testpassword"
          SUPABASE_KEY: "test-supabase-key"
          JWT_SECRET: "test-jwt-secret-key-that-is-at-least-256-bits-long-for-testing"
          GMAIL_APP_PASSWORD: "test-password"
          PAYHERE_SECRET: "test-payhere-secret"
        run: mvn test-compile

  test-chatbot:
    name: 🐍 Validate Chatbot Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: chatbot-service

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Syntax Validation
        run: |
          python -m py_compile main.py data_sync.py

  deploy:
    name: 🚀 Deploy to AWS EC2
    needs: [test-backend, test-chatbot]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: 🔐 Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            echo "========================================================"
            echo "🚀 Starting TravelHub Deployment on AWS EC2..."
            echo "========================================================"

            # Locate project root directory on EC2 or clone fresh if not present
            if [ -d "$HOME/travelhub/.git" ]; then
              cd "$HOME/travelhub"
            elif [ -d "/var/www/travelhub/.git" ]; then
              cd "/var/www/travelhub"
            else
              echo "📥 Repo not found, cloning fresh into ~/travelhub..."
              git clone https://github.com/pirathee587/travelhub.git "$HOME/travelhub"
              cd "$HOME/travelhub"
            fi

            echo "📥 Pulling latest updates from git repository..."
            git fetch --all
            # Checkout current branch or reset to main/master
            BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git reset --hard "origin/$BRANCH"

            echo "🐳 Rebuilding and starting Docker containers..."
            docker compose down --remove-orphans 2>/dev/null || docker-compose down --remove-orphans 2>/dev/null || true
            docker compose up -d --build --remove-orphans 2>/dev/null || docker-compose up -d --build --remove-orphans

            echo "🧹 Cleaning up unused Docker images..."
            docker image prune -f

            echo "⏳ Checking container status and health..."
            sleep 15
            docker compose ps 2>/dev/null || docker-compose ps

            echo "========================================================"
            echo "✅ TravelHub backend & chatbot successfully deployed!"
            echo "========================================================"
